<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Cobranzas — Prácticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-body:#121212;
    --cover:#1e1e1e;
    --paper:#181818;
    --paper-card:#222222;
    --paper-line:#2d2d2d;
    --ink:#f0f0f0;
    --muted:#a0a0a0;
    --red:#e53935;
    --red-hover:#ef5350;
    --red-bg:#3b1315;
    --green:#4caf50;
    --green-bg:#143317;
    --amber:#ffb74d;
    --amber-bg:#3a290d;
    --radius:6px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-body);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  ::selection{background:var(--red);color:#fff;}

  header.cover{
    background:var(--cover);
    padding:22px clamp(16px,4vw,40px) 0;
    border-bottom:3px solid var(--red);
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  .cover-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;gap:14px;
    max-width:1180px;margin:0 auto;
    padding-bottom:18px;
  }
  .cover-title{display:flex;align-items:center;gap:14px;}
  .stamp-mark{
    width:46px;height:46px;border:2px solid var(--red);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--red);font-family:'Spectral',serif;font-size:22px;font-weight:600;
    flex:none;
    box-shadow:0 0 10px rgba(229,57,53,0.3);
  }
  h1{
    font-family:'Spectral',serif;color:#ffffff;margin:0;
    font-size:clamp(20px,3vw,26px);font-weight:600;letter-spacing:.2px;
  }
  .subtitle{margin:2px 0 0;color:var(--muted);font-size:13px;letter-spacing:.4px;text-transform:uppercase;}
  .cover-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  #syncStatus{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
    border-right:1px solid var(--paper-line);padding-right:12px;margin-right:2px;
  }
  #syncStatus.dirty{color:var(--amber);}
  #syncStatus.error{color:var(--red-hover);}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;cursor:pointer;
    border-radius:var(--radius);border:1px solid transparent;padding:9px 14px;
    transition:all 0.2s ease;
  }
  .btn-primary{background:var(--red);color:#ffffff;border-color:var(--red);}
  .btn-primary:hover{background:var(--red-hover);border-color:var(--red-hover);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--paper-line);}
  .btn-ghost:hover{border-color:var(--red);color:var(--red);}
  .btn-danger{background:transparent;color:var(--red);border-color:var(--red);}
  .btn-danger:hover{background:var(--red);color:#ffffff;}
  .btn-small{padding:5px 10px;font-size:12px;}

  nav.tabs{
    max-width:1180px;margin:16px auto 0;display:flex;gap:4px;
    padding:0 clamp(16px,4vw,40px);
  }
  .tab{
    background:#252525;color:var(--muted);border:1px solid var(--paper-line);border-bottom:none;
    padding:10px 18px;border-radius:6px 6px 0 0;font-size:13px;
  }
  .tab.active{background:var(--paper);color:var(--ink);border-color:var(--red);border-bottom:1px solid var(--paper);}

  main.paper{
    background:var(--paper);
    max-width:1180px;margin:0 auto 40px;
    padding:clamp(16px,3vw,32px);
    min-height:400px;
    border:1px solid var(--paper-line);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .panel-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
  .panel-head h2{font-family:'Spectral',serif;font-size:20px;margin:0;font-weight:600;color:#fff;}
  .panel-head p{margin:2px 0 0;color:var(--muted);font-size:13px;}

  /* Tabla principal */
  .ledger-wrap{overflow-x:auto;border:1px solid var(--paper-line);border-radius:4px;background:#141414;}
  table.ledger{border-collapse:collapse;width:100%;font-size:13px;}
  table.ledger th,table.ledger td{
    border-bottom:1px solid var(--paper-line);
    padding:9px 12px;text-align:left;white-space:nowrap;
  }
  table.ledger thead th{
    background:#222222;font-family:'Inter',sans-serif;font-weight:600;font-size:11.5px;
    text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
    position:sticky;top:0;
  }
  table.ledger td.num,table.ledger th.num{font-family:'IBM Plex Mono',monospace;}
  table.ledger tbody tr:hover{background:#1f1f1f;}
  .sticky-col{position:sticky;left:0;background:#181818;z-index:1;border-right:1px solid var(--paper-line);}
  thead .sticky-col{background:#222222;z-index:2;}
  .practica-head{cursor:default;}
  .practica-head small{display:block;font-weight:400;text-transform:none;color:var(--red-hover);font-family:'IBM Plex Mono',monospace;}

  .cell-btn{
    width:100%;min-width:85px;padding:6px 8px;border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;
    border:1px dashed var(--paper-line);background:#1a1a1a;color:var(--muted);
  }
  .cell-btn.paid{background:var(--green-bg);color:var(--green);border:1px solid var(--green);}
  .cell-btn.partial{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber);}
  .cell-btn.unpaid:hover{border-color:var(--red);color:var(--red-hover);background:#251515;}

  /* Formas y Listas */
  .form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px;}
  .field label{font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:600;}
  .field input,.field select{
    font-family:'Inter',sans-serif;font-size:13.5px;padding:9px 10px;
    border:1px solid var(--paper-line);border-radius:var(--radius);background:#242424;color:var(--ink);
  }
  .field input:focus,.field select:focus{
    outline:2px solid var(--red);
    border-color:var(--red);
  }

  .row-actions{display:flex;gap:6px;}
  .list-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  .list-table th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--paper-line);padding:8px 10px;}
  .list-table td{padding:10px;border-bottom:1px solid var(--paper-line);}
  .list-table td.num{font-family:'IBM Plex Mono',monospace;}

  /* Resumen */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px;}
  .stamp-card{
    background:var(--paper-card);border:1px solid var(--paper-line);border-radius:6px;padding:16px 18px;
    position:relative;overflow:hidden;
  }
  .stamp-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;}
  .stamp-card .value{font-family:'IBM Plex Mono',monospace;font-size:22px;margin-top:6px;color:var(--ink);}
  .stamp-card.total-green .value{color:var(--green);}
  .stamp-card.total-red .value{color:var(--red-hover);}

  /* Modales */
  .modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:50;backdrop-filter:blur(3px);
  }
  .modal.hidden{display:none;}
  .modal-box{
    background:#222222;border:1px solid var(--paper-line);border-radius:8px;max-width:460px;width:100%;
    padding:24px;box-shadow:0 20px 50px rgba(0,0,0,0.8);
  }
  .modal-box h3{font-family:'Spectral',serif;margin:0 0 6px;font-size:19px;color:#fff;}
  .modal-box p.hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.4;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .empty{color:var(--muted);font-size:13.5px;padding:24px 0;text-align:center;}
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#2c2c2c;color:#ffffff;padding:10px 18px;border-radius:5px;
    font-size:13px;border:1px solid var(--red);opacity:0;pointer-events:none;
    transition:opacity .25s ease;z-index:100;box-shadow:0 5px 15px rgba(0,0,0,0.5);
  }
  .toast.show{opacity:1;}

  @media (max-width:640px){
    .cover-actions{width:100%;justify-content:flex-start;}
    #syncStatus{border-right:none;padding-right:0;width:100%;}
  }
</style>
</head>
<body>

<header class="cover">
  <div class="cover-top">
    <div class="cover-title">
      <div class="stamp-mark">₲</div>
      <div>
        <h1>Libro de Cobranzas</h1>
        <p class="subtitle">Cuotas de prácticas</p>
      </div>
    </div>
    <div class="cover-actions">
      <span id="syncStatus">cargando...</span>
      <button class="btn-ghost btn-small" id="btnConfigToken">🔑 Token</button>
      <button class="btn-primary" id="btnSave">Guardar cambios</button>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="planilla">Planilla</button>
    <button class="tab" data-tab="practicas">Prácticas</button>
    <button class="tab" data-tab="estudiantes">Estudiantes</button>
    <button class="tab" data-tab="resumen">Resumen</button>
  </nav>
</header>

<main class="paper">
  <!-- PLANILLA -->
  <section id="tab-planilla" class="tab-panel active">
    <div class="panel-head">
      <div>
        <h2>Planilla</h2>
        <p>Click en una celda para registrar el pago de esa práctica.</p>
      </div>
      <button class="btn-ghost btn-small" id="btnExportCsv">Exportar CSV</button>
    </div>
    <div class="ledger-wrap"><div id="grid"></div></div>
  </section>

  <!-- PRACTICAS -->
  <section id="tab-practicas" class="tab-panel">
    <div class="panel-head">
      <div><h2>Prácticas</h2><p>Cada práctica tiene un monto de cuota.</p></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Nombre</label><input id="pNombre" placeholder="Ej: Práctica II"></div>
      <div class="field"><label>Cuota (Gs.)</label><input id="pMonto" type="number" min="0" placeholder="150000"></div>
      <div class="field"><label>Fecha límite</label><input id="pFecha" type="date"></div>
      <div class="field" style="flex:0;align-self:flex-end;"><button class="btn-primary" id="btnAddPractica">+ Agregar</button></div>
    </div>
    <div id="listaPracticas"></div>
  </section>

  <!-- ESTUDIANTES -->
  <section id="tab-estudiantes" class="tab-panel">
    <div class="panel-head">
      <div><h2>Estudiantes</h2><p>Alumnos registrados en el libro.</p></div>
    </div>
    <div class="form-row">
      <div class="field"><label>Nombre</label><input id="eNombre" placeholder="Nombre"></div>
      <div class="field"><label>Apellido</label><input id="eApellido" placeholder="Apellido"></div>
      <div class="field"><label>Cédula</label><input id="eCedula" placeholder="1234567"></div>
      <div class="field" style="flex:0;align-self:flex-end;"><button class="btn-primary" id="btnAddEstudiante">+ Agregar</button></div>
    </div>
    <div id="listaEstudiantes"></div>
  </section>

  <!-- RESUMEN -->
  <section id="tab-resumen" class="tab-panel">
    <div class="panel-head"><div><h2>Resumen</h2><p>Totales por práctica y en general.</p></div></div>
    <div id="resumenTotales" class="summary-grid"></div>
    <div id="resumenTabla"></div>
  </section>
</main>

<!-- Modal Edición Celda -->
<div class="modal hidden" id="cellModal">
  <div class="modal-box">
    <h3 id="cellTitle">Registrar pago</h3>
    <p class="hint" id="cellSubtitle"></p>
    <div class="field" style="margin-bottom:10px;"><label>Monto pagado (Gs.)</label><input id="cellMonto" type="number" min="0"></div>
    <div class="field" style="margin-bottom:10px;"><label>Fecha de pago</label><input id="cellFecha" type="date"></div>
    <div class="field"><label>Observación</label><input id="cellObs" placeholder="Opcional"></div>
    <div class="modal-actions">
      <button class="btn-danger btn-small" id="btnClearCell">Quitar pago</button>
      <button class="btn-ghost btn-small" id="btnCancelCell">Cancelar</button>
      <button class="btn-primary btn-small" id="btnSaveCell">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- Configuración ---------------- */
const LS_DATA = 'cobranzas_data_v1';
const LS_TOKEN = 'cobranzas_github_token';

const REPO_OWNER = 'mjeremiasby';
const REPO_NAME = 'practica_pruebas';
const FILE_PATH = 'data/cobranzas.json';
const API_GITHUB_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

let state = {
  practicas: [],
  estudiantes: [],
  pagos: {}
};

let dirty = false;
let loadingShared = false;
let savingShared = false;
let activeCell = null;
let currentFileSha = null;

/* ---------------- Utilidades ---------------- */
const uid = () => Math.random().toString(36).slice(2,10);
const fmtGs = n => (Number(n)||0).toLocaleString('es-PY') + ' Gs.';
const todayISO = () => new Date().toISOString().slice(0,10);

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isError ? 'var(--red)' : 'var(--green)';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 3200);
}

function setDirty(v){
  dirty = v;
  const el = document.getElementById('syncStatus');
  if(v){ el.textContent = 'cambios sin guardar'; el.className = 'dirty'; }
  saveLocal();
}

function saveLocal(){ localStorage.setItem(LS_DATA, JSON.stringify(state)); }
function loadLocal(){
  const raw = localStorage.getItem(LS_DATA);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){} }
}

/* ---------------- Gestión del Token ---------------- */
function getSavedToken(){
  return localStorage.getItem(LS_TOKEN) || '';
}

function promptForToken(){
  const current = getSavedToken();
  const token = prompt('Ingresa tu Personal Access Token de GitHub (ghp_...):', current);
  if(token !== null){
    localStorage.setItem(LS_TOKEN, token.trim());
    if(token.trim()){
      toast('Token guardado en tu navegador');
      loadFromShared();
    }
  }
}

document.getElementById('btnConfigToken').addEventListener('click', promptForToken);

/* ---------------- Tabs ---------------- */
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='resumen') renderResumen();
  });
});

/* ---------------- Render: Planilla ---------------- */
function renderGrid(){
  const grid = document.getElementById('grid');
  if(state.estudiantes.length===0 || state.practicas.length===0){
    grid.innerHTML = `<div class="empty">Agregá al menos un estudiante y una práctica para ver la planilla.</div>`;
    return;
  }
  const estudiantes = [...state.estudiantes].sort((a,b)=> (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre));
  let html = '<table class="ledger"><thead><tr><th class="sticky-col">Estudiante</th>';
  state.practicas.forEach(p=>{
    html += `<th class="num practica-head">${escapeHtml(p.nombre)}<small>${fmtGs(p.monto)}</small></th>`;
  });
  html += '</tr></thead><tbody>';
  estudiantes.forEach(e=>{
    html += `<tr><td class="sticky-col">${escapeHtml(e.apellido)}, ${escapeHtml(e.nombre)}</td>`;
    state.practicas.forEach(p=>{
      const key = e.id+'__'+p.id;
      const pago = state.pagos[key];
      let cls='unpaid', label='—';
      if(pago){
        if(Number(pago.monto) >= Number(p.monto) && Number(p.monto) > 0){ cls='paid'; label='✓ '+fmtGs(pago.monto); }
        else { cls='partial'; label=fmtGs(pago.monto); }
      }
      html += `<td><button class="cell-btn ${cls}" data-est="${e.id}" data-prac="${p.id}">${label}</button></td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  grid.innerHTML = html;
  grid.querySelectorAll('.cell-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> openCellModal(btn.dataset.est, btn.dataset.prac));
  });
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- Modal Celda ---------------- */
function openCellModal(estId, pracId){
  activeCell = {estId, pracId};
  const est = state.estudiantes.find(x=>x.id===estId);
  const prac = state.practicas.find(x=>x.id===pracId);
  const pago = state.pagos[estId+'__'+pracId];
  document.getElementById('cellTitle').textContent = `${est.nombre} ${est.apellido}`;
  document.getElementById('cellSubtitle').textContent = `${prac.nombre} · cuota ${fmtGs(prac.monto)}`;
  document.getElementById('cellMonto').value = pago ? pago.monto : prac.monto;
  document.getElementById('cellFecha').value = pago ? pago.fecha : todayISO();
  document.getElementById('cellObs').value = pago ? (pago.obs||'') : '';
  document.getElementById('cellModal').classList.remove('hidden');
}
document.getElementById('btnCancelCell').addEventListener('click', ()=> document.getElementById('cellModal').classList.add('hidden'));
document.getElementById('btnSaveCell').addEventListener('click', ()=>{
  const {estId, pracId} = activeCell;
  const monto = document.getElementById('cellMonto').value;
  const fecha = document.getElementById('cellFecha').value || todayISO();
  const obs = document.getElementById('cellObs').value;
  state.pagos[estId+'__'+pracId] = { monto: Number(monto)||0, fecha, obs };
  document.getElementById('cellModal').classList.add('hidden');
  setDirty(true); renderGrid();
});
document.getElementById('btnClearCell').addEventListener('click', ()=>{
  const {estId, pracId} = activeCell;
  delete state.pagos[estId+'__'+pracId];
  document.getElementById('cellModal').classList.add('hidden');
  setDirty(true); renderGrid();
});

/* ---------------- Prácticas ---------------- */
document.getElementById('btnAddPractica').addEventListener('click', ()=>{
  const nombre = document.getElementById('pNombre').value.trim();
  const monto = document.getElementById('pMonto').value;
  const fecha = document.getElementById('pFecha').value;
  if(!nombre){ toast('Poné un nombre para la práctica', true); return; }
  state.practicas.push({id:uid(), nombre, monto:Number(monto)||0, fecha});
  document.getElementById('pNombre').value='';
  document.getElementById('pMonto').value='';
  document.getElementById('pFecha').value='';
  setDirty(true); renderPracticas(); renderGrid();
});
function renderPracticas(){
  const el = document.getElementById('listaPracticas');
  if(state.practicas.length===0){ el.innerHTML = '<div class="empty">Todavía no agregaste prácticas.</div>'; return; }
  let html = '<table class="list-table"><thead><tr><th>Nombre</th><th>Cuota</th><th>Fecha límite</th><th></th></tr></thead><tbody>';
  state.practicas.forEach(p=>{
    html += `<tr><td>${escapeHtml(p.nombre)}</td><td class="num">${fmtGs(p.monto)}</td><td>${p.fecha||'—'}</td>
      <td><div class="row-actions"><button class="btn-danger btn-small" data-del="${p.id}">Eliminar</button></div></td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('¿Eliminar esta práctica? También se borran los pagos registrados en ella.')) return;
    const id = b.dataset.del;
    state.practicas = state.practicas.filter(p=>p.id!==id);
    Object.keys(state.pagos).forEach(k=>{ if(k.endsWith('__'+id)) delete state.pagos[k]; });
    setDirty(true); renderPracticas(); renderGrid();
  }));
}

/* ---------------- Estudiantes ---------------- */
document.getElementById('btnAddEstudiante').addEventListener('click', ()=>{
  const nombre = document.getElementById('eNombre').value.trim();
  const apellido = document.getElementById('eApellido').value.trim();
  const cedula = document.getElementById('eCedula').value.trim();
  if(!nombre || !apellido){ toast('Poné nombre y apellido', true); return; }
  state.estudiantes.push({id:uid(), nombre, apellido, cedula});
  document.getElementById('eNombre').value='';
  document.getElementById('eApellido').value='';
  document.getElementById('eCedula').value='';
  setDirty(true); renderEstudiantes(); renderGrid();
});
function renderEstudiantes(){
  const el = document.getElementById('listaEstudiantes');
  if(state.estudiantes.length===0){ el.innerHTML = '<div class="empty">Todavía no agregaste estudiantes.</div>'; return; }
  const rows = [...state.estudiantes].sort((a,b)=> (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre));
  let html = '<table class="list-table"><thead><tr><th>Apellido</th><th>Nombre</th><th>Cédula</th><th></th></tr></thead><tbody>';
  rows.forEach(e=>{
    html += `<tr><td>${escapeHtml(e.apellido)}</td><td>${escapeHtml(e.nombre)}</td><td>${escapeHtml(e.cedula)}</td>
      <td><div class="row-actions"><button class="btn-danger btn-small" data-del="${e.id}">Eliminar</button></div></td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    if(!confirm('¿Eliminar este estudiante? También se borran sus pagos.')) return;
    const id = b.dataset.del;
    state.estudiantes = state.estudiantes.filter(e=>e.id!==id);
    Object.keys(state.pagos).forEach(k=>{ if(k.startsWith(id+'__')) delete state.pagos[k]; });
    setDirty(true); renderEstudiantes(); renderGrid();
  }));
}

/* ---------------- Resumen ---------------- */
function renderResumen(){
  const totalesEl = document.getElementById('resumenTotales');
  const tablaEl = document.getElementById('resumenTabla');
  let granEsperado=0, granRecaudado=0;
  let filas = state.practicas.map(p=>{
    const esperado = p.monto * state.estudiantes.length;
    let recaudado = 0, pagaron = 0;
    state.estudiantes.forEach(e=>{
      const pago = state.pagos[e.id+'__'+p.id];
      if(pago){ recaudado += Number(pago.monto)||0; if(Number(pago.monto) >= Number(p.monto)) pagaron++; }
    });
    granEsperado += esperado; granRecaudado += recaudado;
    return {p, esperado, recaudado, pendiente: esperado-recaudado, pagaron};
  });
  totalesEl.innerHTML = `
    <div class="stamp-card"><div class="label">Esperado total</div><div class="value">${fmtGs(granEsperado)}</div></div>
    <div class="stamp-card total-green"><div class="label">Recaudado</div><div class="value">${fmtGs(granRecaudado)}</div></div>
    <div class="stamp-card total-red"><div class="label">Pendiente</div><div class="value">${fmtGs(granEsperado-granRecaudado)}</div></div>
  `;
  if(filas.length===0){ tablaEl.innerHTML = '<div class="empty">Agregá prácticas para ver el detalle.</div>'; return; }
  let html = '<table class="list-table"><thead><tr><th>Práctica</th><th>Cuota</th><th>Esperado</th><th>Recaudado</th><th>Pendiente</th><th>Pagaron completo</th></tr></thead><tbody>';
  filas.forEach(f=>{
    html += `<tr><td>${escapeHtml(f.p.nombre)}</td><td class="num">${fmtGs(f.p.monto)}</td><td class="num">${fmtGs(f.esperado)}</td>
      <td class="num">${fmtGs(f.recaudado)}</td><td class="num">${fmtGs(f.pendiente)}</td><td class="num">${f.pagaron}/${state.estudiantes.length}</td></tr>`;
  });
  html += '</tbody></table>';
  tablaEl.innerHTML = html;
}

/* ---------------- Export CSV ---------------- */
document.getElementById('btnExportCsv').addEventListener('click', ()=>{
  if(state.estudiantes.length===0){ toast('No hay datos para exportar', true); return; }
  const estudiantes = [...state.estudiantes].sort((a,b)=> (a.apellido+a.nombre).localeCompare(b.apellido+b.nombre));
  let rows = [['Apellido','Nombre','Cédula', ...state.practicas.map(p=>p.nombre), 'Total pagado']];
  estudiantes.forEach(e=>{
    let total = 0;
    const cells = state.practicas.map(p=>{
      const pago = state.pagos[e.id+'__'+p.id];
      const monto = pago ? Number(pago.monto)||0 : 0;
      total += monto;
      return monto;
    });
    rows.push([e.apellido, e.nombre, e.cedula, ...cells, total]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'cobranzas_practicas.csv';
  a.click();
});

/* ---------------- API GitHub ---------------- */
async function loadFromShared(){
  if(loadingShared) return;
  loadingShared = true;
  const statusEl = document.getElementById('syncStatus');
  statusEl.textContent = 'sincronizando...';
  statusEl.className = '';

  const token = getSavedToken();

  try {
    const headers = {};
    if(token) headers['Authorization'] = `token ${token}`;

    const metaRes = await fetch(`${API_GITHUB_URL}?_t=${Date.now()}`, {
      headers,
      cache: 'no-store'
    });

    if(!metaRes.ok) throw new Error('HTTP ' + metaRes.status);
    
    const meta = await metaRes.json();
    currentFileSha = meta.sha;

    const binary = atob(meta.content.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    const jsonStr = new TextDecoder().decode(bytes);
    const json = JSON.parse(jsonStr);

    state = Object.assign({practicas:[], estudiantes:[], pagos:{}}, json);

    saveLocal();
    dirty = false;
    renderAll();

    statusEl.textContent = 'sincronizado con GitHub ✓';
    statusEl.className = '';
  } catch(err) {
    console.error(err);
    statusEl.textContent = token ? 'error al sincronizar' : 'ingresa tu token (🔑)';
    statusEl.className = 'error';
  } finally {
    loadingShared = false;
  }
}

async function saveToShared(){
  let token = getSavedToken();
  if(!token){
    promptForToken();
    token = getSavedToken();
    if(!token) return;
  }

  if(savingShared) return;
  savingShared = true;

  const statusEl = document.getElementById('syncStatus');
  statusEl.textContent = 'guardando en GitHub...';
  statusEl.className = '';

  try {
    if(!currentFileSha){
      const metaRes = await fetch(API_GITHUB_URL, {
        headers: { 'Authorization': `token ${token}` },
        cache: 'no-store'
      });
      if(metaRes.ok){
        const meta = await metaRes.json();
        currentFileSha = meta.sha;
      }
    }

    const jsonStr = JSON.stringify(state, null, 2);
    const bytes = new TextEncoder().encode(jsonStr);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    const contentBase64 = btoa(binary);

    const bodyData = {
      message: 'Actualización de cobranzas',
      content: contentBase64,
      sha: currentFileSha
    };

    const res = await fetch(API_GITHUB_URL, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(bodyData)
    });

    if(!res.ok){
      const errJson = await res.json().catch(()=> ({}));
      throw new Error(errJson.message || ('HTTP ' + res.status));
    }

    const resData = await res.json();
    currentFileSha = resData.content.sha;

    dirty = false;
    saveLocal();

    statusEl.textContent = 'guardado en GitHub ✓';
    statusEl.className = '';
    toast('¡Cambios guardados en GitHub!');
  } catch(err) {
    console.error(err);
    statusEl.textContent = 'error al guardar';
    statusEl.className = 'error';
    toast('Error: ' + err.message, true);
  } finally {
    savingShared = false;
  }
}

document.getElementById('btnSave').addEventListener('click', saveToShared);

/* Recarga automática cada 15s */
setInterval(()=>{
  if(!dirty && !loadingShared && !savingShared){
    loadFromShared();
  }
}, 15000);

/* Init */
function renderAll(){
  renderPracticas();
  renderEstudiantes();
  renderGrid();
  renderResumen();
}

loadLocal();
renderAll();
loadFromShared();
</script>
